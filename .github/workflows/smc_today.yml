name: 4H-1H-15m Test

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days to test (1 = today from 5:30 AM IST)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
          - "7"
          - "14"
          - "30"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN || secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID || secrets.TG_CHAT_ID }}
        run: python smc_today.py "${{ github.event.inputs.days || '1' }}"
